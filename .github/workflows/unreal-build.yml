name: Unreal Engine 5.6 BuildWorks build

on:
  workflow_dispatch:
  push:
    branches:
      - unreal-bootstrap
    paths:
      - 'Unreal/BuildWorks/**'
      - '.github/workflows/unreal-build.yml'

permissions:
  contents: read

jobs:
  build:
    # UE 5.6's documented Linux toolchain is based on Ubuntu 22.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Check out BuildWorks
        uses: actions/checkout@v4

      - name: Validate BuildWorks project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('Unreal/BuildWorks/BuildWorks.uproject')
          data = json.loads(p.read_text())
          assert data['FileVersion'] == 3, 'Unexpected .uproject FileVersion'
          assert data['EngineAssociation'] == '5.6', 'Project must target Unreal Engine 5.6'
          assert any(m['Name'] == 'BuildWorks' for m in data['Modules']), 'BuildWorks module missing'
          print('BuildWorks project descriptor: PASS')
          PY
          test -f Unreal/BuildWorks/Source/BuildWorks/BuildWorks.Build.cs
          test -f Unreal/BuildWorks/Source/BuildWorks/BuildWorks.cpp
          test -f Unreal/BuildWorks/Source/BuildWorks.Target.cs
          test -f Unreal/BuildWorks/Source/BuildWorksEditor.Target.cs
          echo 'BuildWorks C++ scaffold: PASS'

      - name: Authenticate to Epic and clone Unreal Engine 5.6
        env:
          UE_GITHUB_TOKEN: ${{ secrets.UE_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${UE_GITHUB_TOKEN:-}" ]]; then
            echo "::error::Actions secret UE_GITHUB_TOKEN is missing."
            exit 1
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "$UE_GITHUB_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" ls-remote https://github.com/EpicGames/UnrealEngine.git refs/heads/5.6 >/dev/null || {
            echo "::error::GitHub Actions cannot read EpicGames/UnrealEngine branch 5.6. The token must explicitly have Contents: Read access to EpicGames/UnrealEngine and any required EpicGames organization approval."
            exit 1
          }
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" clone --depth 1 --branch 5.6 https://github.com/EpicGames/UnrealEngine.git "$RUNNER_TEMP/UnrealEngine"
          echo "Epic Unreal Engine 5.6 source checkout: PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld cmake ninja-build             mono-complete dos2unix libssl-dev libx11-dev libxcursor-dev             libxinerama-dev libxrandr-dev libxi-dev libgl1-mesa-dev             libvulkan1 vulkan-tools

      - name: Download Unreal prerequisites and generate project files
        working-directory: ${{ runner.temp }}/UnrealEngine
        shell: bash
        run: |
          set -euo pipefail
          ./Setup.sh
          ./GenerateProjectFiles.sh

      - name: Build Unreal Editor
        working-directory: ${{ runner.temp }}/UnrealEngine
        shell: bash
        run: |
          set -euo pipefail
          Engine/Build/BatchFiles/Linux/Build.sh UnrealEditor Linux Development             -WaitMutex -NoHotReloadFromIDE

      - name: Build BuildWorks Editor target
        working-directory: ${{ runner.temp }}/UnrealEngine
        shell: bash
        run: |
          set -euo pipefail
          Engine/Build/BatchFiles/Linux/Build.sh BuildWorksEditor Linux Development             -Project="$GITHUB_WORKSPACE/Unreal/BuildWorks/BuildWorks.uproject"             -WaitMutex -NoHotReloadFromIDE
          echo "BuildWorks Editor compile: PASS" >> "$GITHUB_STEP_SUMMARY"
